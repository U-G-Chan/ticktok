# 每次 push / PR 时在云端执行：安装依赖 + 类型检查 + 构建。
# 不访问你的服务器，用于保证「合进去的代码始终能 build」。
name: Frontend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    # 让 checkout/setup-node 等 JS Action 使用 Node 24 运行时，避免 Node 20 弃用告警（与下方 node-version 无关）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
